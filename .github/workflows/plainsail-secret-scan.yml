name: Plainsail secret scan

on:
  push:
    paths:
      - "PlainSail/plainsail-platform/**"
      - ".github/workflows/plainsail-secret-scan.yml"
  pull_request:
    paths:
      - "PlainSail/plainsail-platform/**"
      - ".github/workflows/plainsail-secret-scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plainsail-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan committed content and history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Plainsail local scanner
        run: python3 PlainSail/plainsail-platform/scripts/scan_secrets.py

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
